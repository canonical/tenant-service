apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tenant-service-route
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: authorization-service-gateway
      namespace: default
  hostnames:
    - "localhost"
    - "iam.internal.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v0/tenants
        - path:
            type: PathPrefix
            value: /api/v0/me/tenants
        - path:
            type: PathPrefix
            value: /api/v0/users
        - path:
            type: PathPrefix
            value: /api/v0/status
      backendRefs:
        - name: tenant-service
          port: 8080
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: tenant-service-ext-authz
  namespace: default
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: authorization-service-gateway
  # Delegate authorization checks to the external authorization service
  action: CUSTOM
  provider:
    name: "authorization-service"
  rules:
    - to:
        - operation:
            # Protect all /api/v0/ routes by default (fail-secure)
            paths:
              - "/api/v0/*"
            notPaths:
              # Bypass authorization-service for me/tenants:
              # tenant-service directly validates caller JWT and extracts user ID
              - "/api/v0/me/tenants"
              # Unauthenticated tenant lookup used by login UI
              - "/api/v0/tenants/lookup"
              # Unauthenticated service status
              - "/api/v0/status"
