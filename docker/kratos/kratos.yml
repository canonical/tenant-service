version: v1.1.0

oauth2_provider:
    url: "http://hydra:4445"
log:
    level: debug
    format: text
    leak_sensitive_values: true
dsn: memory
serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: True
  admin:
    base_url: http://kratos:4434/

identity:
    default_schema_id: default
    schemas:
        - id: default
          url: file:///etc/config/kratos/identity.schema.json
session:
  whoami:
    required_aal: highest_available

selfservice:
    allowed_return_urls:
      - http://localhost/ui
    default_browser_return_url:
        http://localhost/ui/
    flows:
        error:
            ui_url: http://localhost/ui/error
        login:
            ui_url: http://localhost/ui/login
            style: identifier_first
            after:
                hooks:
                    - hook: web_hook
                      config:
                        url: http://host.docker.internal:8000/api/v0/webhooks/login
                        method: POST
                        # Jsonnet template: always sends identity_id and email (ctx.identity is always
                        # populated when PostLoginHook fires). tenant_id is included when login-ui
                        # has injected it into ctx.flow.transient_payload; otherwise it is "".
                        # NOTE: ctx.flow.state == "passed_challenge" is NOT used because Kratos sets
                        # that state *after* the post-login hooks complete, so the condition would
                        # never be true. The service handles duplicate/intermediate calls gracefully.
                        body: base64:
                        response:
                           ignore: false
                        auth:
                          type: api_key
                          config:
                            name: Authorization
                            value: secret_api_key
                            in: header
        recovery:
            enabled: True
            ui_url: http://localhost/ui/reset_email
            use: code
            after:
                default_browser_return_url: http://localhost/ui
                hooks:
                    - hook: revoke_active_sessions
        settings:
            # TODO: Replace with self-service settings page when implemented
            ui_url: http://localhost/ui/reset_password
            required_aal: highest_available
            after:
                webauthn:
                    default_browser_return_url: http://localhost/ui/setup_passkey
        registration:
            ui_url: http://localhost:8080/some/path/ui/registration_error
            after:
                hooks:
                    - hook: web_hook
                      config:
                        url: http://host.docker.internal:8000/api/v0/webhooks/registration
                        method: POST
                        body: base64://ZnVuY3Rpb24oY3R4KSB7CiAgdXNlcl9pZDogY3R4LmlkZW50aXR5LmlkLAogIGVtYWlsOiBjdHguaWRlbnRpdHkudHJhaXRzLmVtYWlsLAp9
                        response:
                           ignore: false
                        auth:
                          type: api_key
                          config:
                            name: Authorization
                            value: secret_api_key
                            in: header
                password:
                    hooks:
                    - hook: web_hook
                      config:
                        url: http://host.docker.internal:8000/api/v0/webhooks/registration
                        method: POST
                        body: base64://ZnVuY3Rpb24oY3R4KSB7CiAgdXNlcl9pZDogY3R4LmlkZW50aXR5LmlkLAogIGVtYWlsOiBjdHguaWRlbnRpdHkudHJhaXRzLmVtYWlsLAp9
                        response:
                           ignore: false
                        auth:
                          type: api_key
                          config:
                            name: Authorization
                            value: secret_api_key
                            in: header
                    - hook: session
                oidc:
                    hooks:
                    - hook: web_hook
                      config:
                        url: http://host.docker.internal:8000/api/v0/webhooks/registration
                        method: POST
                        body: base64://ZnVuY3Rpb24oY3R4KSB7CiAgdXNlcl9pZDogY3R4LmlkZW50aXR5LmlkLAogIGVtYWlsOiBjdHguaWRlbnRpdHkudHJhaXRzLmVtYWlsLAp9
                        response:
                           ignore: false
                        auth:
                          type: api_key
                          config:
                            name: Authorization
                            value: secret_api_key
                            in: header
                    - hook: session
                webauthn:
                    hooks:
                    - hook: web_hook
                      config:
                        url: http://host.docker.internal:8000/api/v0/webhooks/registration
                        method: POST
                        body: base64://ZnVuY3Rpb24oY3R4KSB7CiAgdXNlcl9pZDogY3R4LmlkZW50aXR5LmlkLAogIGVtYWlsOiBjdHguaWRlbnRpdHkudHJhaXRzLmVtYWlsLAp9
                        response:
                           ignore: false
                        auth:
                          type: api_key
                          config:
                            name: Authorization
                            value: secret_api_key
                            in: header
                    - hook: session
    methods:
        totp:
            enabled: true
            config:
                issuer: Identity Platform
        lookup_secret:
            enabled: true
        password:
            enabled: True
            config:
                haveibeenpwned_enabled: false
        code:
            enabled: True
        webauthn:
            enabled: True
            config:
                passwordless: True
                rp:
                    # Set 'id' to the top-level domain.
                    id: localhost
                    # Set 'origin' to the exact URL of the page that prompts the user to use WebAuthn. You must include the scheme, host, and port.
                    origins:
                        - http://localhost
                    display_name: Canonical
        oidc:
            enabled: True
            config:
                providers:
                - id: "github"
                  provider: "github"
                  mapper_url: "file:///etc/config/kratos/schema.jsonnet"
                  scope: ["user:email"]
                  label: Github
                - id: "dex"
                  provider: "generic"
                  client_id: "kratos"
                  client_secret: "dex-client-secret"
                  issuer_url: "http://dex:5556/dex"
                  mapper_url: "file:///etc/config/kratos/schema.jsonnet"
                  scope:
                    - openid
                    - email
                    - profile
                  label: "Dex"
courier:
    smtp:
        connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
